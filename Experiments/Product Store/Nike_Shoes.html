<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike - Minimal Shoe Store</title>
    <link rel="stylesheet" href="shoe_styles.css">
</head>
<body>
    <header>
        <div class="logo">NIKE</div>
        <nav>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="product-image" ></dv>
            <img src="future-sneaker-8753958_1920.jpg" alt="A beautiful scenery" height="369" width="429" display="centred">
            
        </div>

        <div class="product-details">
            <h1>Air Max 90</h1>
            <p class="brand">Premium Sneaker Collection</p>
            
            <p class="description">
                Iconic comfort meets timeless style. The Air Max 90 features responsive cushioning and breathable design for all-day wear.
            </p>

            <div class="price-box">
                <span class="price">$120.00</span>
            </div>

            <div class="controls">
                <input type="number" class="qty" value="1" min="1">
                <button class="btn">Add to Cart</button>
            </div>

            <div class="info">
                <p>✓ Free Shipping</p>
                <p>✓ 30-Day Return</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Nike Store. All rights reserved.</p>
    </footer>
</body>
</html>
