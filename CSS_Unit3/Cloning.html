<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website 1</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #222;
    }
    nav {
        background: #202020;
        padding: 10px 0;
        z-index: 1;
        width: 100%;
        height: 50px;
        margin-bottom: 10px;
        position: fixed;
        top: 0;
        z-index: 1;
    }
    nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 20px;
    }
    nav ul li a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }
    main {
        width: 100vw; 
        height: 100lh;             
        margin: 20px 0;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 100px 300px 500px 400px 400px 100px ;
        gap: 10px;
        z-index: 0;
    }
    
    #banner, header, #about, #services, #Gallery, #footer {
      background: #ccc;
      padding: 10px;
      display: grid;
      place-items: center;   
      border-radius: 5px;
    }
</style>
</head>
<body>
    <nav>
        <ul>
            <li><a href=" ">Home</a></li>
            <li><a href=" ">About</a></li>
            <li><a href=" ">Services</a></li>
            <li><a href=" ">Gallery</a></li>
            <li><a href=" ">Contact</a></li>
        </ul>
    </nav>

    <main>
        <header><h2> Home </h2></header>
        <div id="banner"><h2>Image</h2></div>
        <div id="about"><h2>About</h2></div>
        <div id="services"><h2>Services</h2></div>
        <div id="Gallery"><h2>Gallery</h2></div>
        <div id="footer"><h2>Contact</h2></div>
    </main>
</body>
</html>
