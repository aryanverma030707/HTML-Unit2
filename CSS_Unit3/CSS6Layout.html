<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Stacked & Vertical Rectangles</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 30px; background: #fafafa; font-family: Arial, sans-serif; }
        h1 { text-align: center; margin-bottom: 24px; }
        h2 { margin: 18px 0 10px; font-size: 1rem; color: #333; }

        /* 1) Three rectangles stacked vertically (one above the other) */
        .stacked { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 24px; }
        .stacked .rect { width: 80%; max-width: 600px; height: 80px; background: #ff6b6b; border-radius: 6px; display:flex;align-items:center;justify-content:center;color:white;font-weight:700; }

        /* 2) Three tall vertical rectangles side-by-side */
        .verticals { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
        .verticals .rect { width: 80px; height: 220px; background: #4ecdc4; border-radius: 6px; display:flex;align-items:center;justify-content:center;color:#053; font-weight:700; }

        /* 3) One wide horizontal rectangle */
        .wide { display:flex; justify-content:center; margin-top: 12px; }
        .wide .rect { width: 90%; max-width: 800px; height: 100px; background: #45b7d1; border-radius: 6px; display:flex;align-items:center;justify-content:center;color:white;font-weight:700; }

    </style>
</head>
<body>
    <h1>Rectangles: stacked, verticals, then wide</h1>

    <h2>1) Three stacked rectangles (one above the other)</h2>
    <div class="stacked">
        <div class="rect">Top</div>
        <div class="rect">Middle</div>
        <div class="rect">Bottom</div>
    </div>

    <h2>2) Three vertical standing rectangles (side-by-side)</h2>
    <div class="verticals">
        <div class="rect">A</div>
        <div class="rect">B</div>
        <div class="rect">C</div>
    </div>

    <h2>3) One wide horizontal rectangle</h2>
    <div class="wide">
        <div class="rect">Wide Bar</div>
    </div>
</body>
</html>
