<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 20px; }
        main { width: 1200px; margin: 0 auto; }
        header { height: 100px; background-color: rgb(208, 162, 197); margin-bottom: 20px; }
        section { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .box { width: 275px; height: 200px; background-color: rgb(255, 208, 0); }
        #content { display: flex; gap: 20px; margin-bottom: 20px; }
        #content .box { flex: 2; }
        footer { height: 100px; background-color: rgb(130, 145, 202); }
    </style>
</head>
<body>
    <main>
        <header><h2>Header</h2></header>
        <section>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </section>

        <div id="content">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div> 
        </div>

        <footer><h2>Footer</h2></footer>
    </main>
    
</body>
</html>
